[package]
name = "memobuild-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Foundational domain types, graph contracts, hashing abstractions, and reproducibility primitives."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
flate2 = "1"
glob = "0.3"
hex = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

walkdir = "2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
