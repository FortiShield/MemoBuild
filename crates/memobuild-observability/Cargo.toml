[package]
name = "memobuild-observability"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared instrumentation abstractions and observability integration."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.6", features = ["http1", "http2", "json"] }
chrono = { version = "0.4", features = ["serde"] }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prometheus-client = "0.22"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
